<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordSpy</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece7ff;--card:#fff;--ink:#1b1340;--mute:#5d5686;--acc:#ff4f81;--pop:#ffd23f;--line:#cfc6f5}
@media (prefers-color-scheme:dark){:root{--bg:#14102e;--card:#221b4a;--ink:#f1edff;--mute:#a9a1d6;--line:#3a3270;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
main{flex:1;width:100%;max-width:440px;padding:28px 20px 40px;display:flex;flex-direction:column;gap:18px}
h1{font-size:2.4rem;line-height:1;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;margin:0;font-weight:800}
p{margin:0;color:var(--mute);line-height:1.45}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
label{font-weight:700;font-size:.95rem}
input,select{font:inherit;font-weight:500;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.btn{font:inherit;font-weight:700;font-size:1.1rem;padding:17px;border-radius:14px;border:0;background:var(--acc);color:#fff;cursor:pointer;width:100%}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.pl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-weight:500}
.pl:last-child{border:0}.pl span{color:var(--mute);font-size:.9rem}
.secret{border-radius:20px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:260px;cursor:pointer;border:0;font:inherit;width:100%}
.secret.hid{background:var(--card);border:2px dashed var(--line);color:var(--ink)}
.secret.word{background:var(--pop);color:#1b1340}
.secret.imp{background:var(--acc);color:#fff}
.secret p{color:inherit;opacity:.85}
.big{font-size:2.6rem;font-weight:800;line-height:1.05;word-break:break-word}
.credit{padding:0 20px 24px;font-size:.85rem;color:var(--mute);text-align:center}
.credit b{font-weight:700;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<main id="app"></main>
<footer class="credit">Made by <b>Asmit Verma</b></footer>
<script>
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m = location.pathname.match(/^\/r\/([A-Za-z0-9]{3,8})/);
const code = m ? m[1].toUpperCase() : null;
let pid = localStorage.getItem('pid');
if (!pid) { pid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('pid', pid); }
let name = localStorage.getItem('name') || '';
let ws, S = null, shown = false, lastRound = 0, catChoice = 'Random', modeChoice = 'classic', joined = false;

function home() {
  app.innerHTML = `<div><h1>WordSpy</h1><p style="margin-top:8px">Start a room, send the link to your friends, and everyone gets their word on their own screen.</p></div>
  <button class="btn" id="mk">Create a room</button>
  <div class="card"><label for="jc">Have a room code?</label><input id="jc" maxlength="8" placeholder="e.g. KQTM" autocomplete="off"><button class="btn alt" id="jn">Join room</button></div>`;
  document.getElementById('mk').onclick = () => {
    const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c = '';
    for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)];
    location.href = '/r/' + c;
  };
  document.getElementById('jn').onclick = () => {
    const v = document.getElementById('jc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v) location.href = '/r/' + v;
  };
}

function askName() {
  app.innerHTML = `<div><h1>Join room ${code}</h1><p style="margin-top:8px">Pick the name your friends will see.</p></div>
  <div class="card"><label for="nm">Your name</label><input id="nm" maxlength="20" value="${esc(name)}" autocomplete="off"></div>
  <button class="btn" id="go">Join</button>`;
  const go = () => {
    const v = document.getElementById('nm').value.trim();
    if (!v) return document.getElementById('nm').focus();
    name = v; localStorage.setItem('name', v); connect();
  };
  document.getElementById('go').onclick = go;
  document.getElementById('nm').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function connect() {
  joined = true;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify({ t: 'join', room: code, pid, name }));
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.t !== 'state') return;
    if (d.round !== lastRound) { shown = false; lastRound = d.round; }
    S = d; render();
  };
  ws.onclose = () => setTimeout(connect, 1500);
  if (!S) app.innerHTML = '<p>Connecting…</p>';
}
const act = (t, extra) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ t, ...extra }));

function players() {
  return `<div class="card">${S.players.map(p => `<div class="pl"><div>${esc(p.name)}</div><span>${p.host ? 'host' : ''}${p.on ? '' : ' offline'}</span></div>`).join('')}</div>`;
}

function render() {
  if (S.phase === 'lobby') {
    const n = S.players.filter(p => p.on).length;
    app.innerHTML = `<div><h2>Room ${S.code}</h2><p style="margin-top:6px">Send this link to your friends. ${n} in the room so far.</p></div>
    <button class="btn alt" id="cp">Copy invite link</button>
    ${players()}
    ${S.host ? `<div class="card"><label for="ct">Category</label><select id="ct"><option>Random</option>${S.cats.map(c => `<option ${c === catChoice ? 'selected' : ''}>${c}</option>`).join('')}</select><label for="md">Game mode</label><select id="md"><option value="classic" ${modeChoice === 'classic' ? 'selected' : ''}>Classic: imposter gets no word</option><option value="similar" ${modeChoice === 'similar' ? 'selected' : ''}>Similar word: imposter gets a close word and doesn’t know</option></select></div>
    <button class="btn" id="st" ${n < 3 ? 'disabled' : ''}>${n < 3 ? 'Need at least 3 players' : 'Deal words'}</button>`
    : '<p>Waiting for the host to start the game.</p>'}`;
    document.getElementById('cp').onclick = async e => {
      try { await navigator.clipboard.writeText(location.href); e.target.textContent = 'Link copied'; }
      catch { prompt('Copy this link:', location.href); }
    };
    if (S.host) {
      document.getElementById('ct').onchange = e => catChoice = e.target.value;
      document.getElementById('md').onchange = e => modeChoice = e.target.value;
      document.getElementById('st').onclick = () => act('start', { cat: catChoice, mode: modeChoice });
    }
    return;
  }
  if (S.phase === 'playing') {
    let card;
    if (S.role === 'waiting') card = `<div class="secret hid" style="cursor:default"><p>A round is already in progress. You’ll get a word in the next round.</p></div>`;
    else if (!shown) card = `<button class="secret hid" id="cd"><div class="big">Tap to see</div><p>Make sure no one else can see your screen</p></button>`;
    else if (S.role === 'imposter') card = `<button class="secret imp" id="cd"><div class="big">You’re the imposter</div><p>The category is <b>${esc(S.cat)}</b>. Blend in. Tap to hide.</p></button>`;
    else card = `<button class="secret word" id="cd"><p>The secret word is</p><div class="big">${esc(S.word)}</div><p>Category: ${esc(S.cat)}. Tap to hide.</p></button>`;
    app.innerHTML = `<div><h2>Round ${S.round}</h2><p style="margin-top:6px">${esc(S.starter)} gives the first clue. Go around the circle, then vote.</p></div>${card}
    ${S.host ? '<button class="btn" id="rv">Reveal the imposter</button>' : ''}`;
    const cd = document.getElementById('cd'); if (cd) cd.onclick = () => { shown = !shown; render(); };
    if (S.host) document.getElementById('rv').onclick = () => act('reveal');
    return;
  }
  app.innerHTML = `<div><h2>The reveal</h2></div>
  <div class="secret imp" style="cursor:default"><p>The imposter was</p><div class="big">${esc(S.reveal.imp || 'Someone')}</div></div>
  <div class="secret word" style="cursor:default;min-height:0;padding:24px"><p>${S.reveal.word2 ? 'The group’s word was' : 'The secret word was'}</p><div class="big">${esc(S.reveal.word)}</div>${S.reveal.word2 ? `<p>The imposter’s word: <b>${esc(S.reveal.word2)}</b></p>` : ''}</div>
  ${S.host ? `<div class="two"><button class="btn" id="nx">Next round</button><button class="btn alt" id="lb">Back to lobby</button></div>` : '<p>Waiting for the host to start the next round.</p>'}`;
  if (S.host) {
    document.getElementById('nx').onclick = () => act('start', { cat: catChoice, mode: modeChoice });
    document.getElementById('lb').onclick = () => act('lobby');
  }
}

if (!code) home(); else if (name) connect(); else askName();
</script>
</body>
</html>
